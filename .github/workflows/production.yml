# Production deployment on every push to main, then the IndexNow ping.
#
# Why a CI deploy and not Vercel's Git integration (off in vercel.json):
#   - The builder needs Go on PATH for the build command; Vercel's build
#     image provides Go only to @vercel/go for functions.
#   - The IndexNow artefact (.vercel/output/indexnow.json) only exists on
#     the machine that ran the build, and must be POSTed after the deploy
#     is live. Here that machine is this runner.
#   - The page manifest the artefact is diffed against lives in the build
#     cache, which this workflow persists with actions/cache.
#
# Secrets (names only): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Variable: INDEXNOW_ENABLED ("true" once hastcode.com points at Vercel;
#           set by scripts/setup-deploy.sh at domain cutover). Until then
#           the key file is not live on site_url's host and Bing answers 403.
name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time, in push order: each build diffs against
# the manifest the previous one saved.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make test

  deploy:
    name: Deploy production
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          vercel-cli: "true"
      # Restore after npm ci (which wipes node_modules/). On main this is
      # always the previous production run's cache.
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/hastcode
          key: hastcode-build-${{ github.run_id }}
          restore-keys: hastcode-build-
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          MODE: production
      # Not part of the site: move it out before uploading the output.
      - name: Set aside the IndexNow artefact
        run: |
          if [ -f .vercel/output/indexnow.json ]; then
            mv .vercel/output/indexnow.json "$RUNNER_TEMP/indexnow.json"
            jq -r '"\(.urlList | length) changed URL(s)"' "$RUNNER_TEMP/indexnow.json"
          else
            echo "nothing changed since the last production build"
          fi
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"
      # 200/202 = accepted; 403 = key file not live on the host yet;
      # 422 = a URL is not on the host. A failed ping fails the job before
      # the cache is saved, so the next build lists these URLs again.
      - name: Ping IndexNow
        if: vars.INDEXNOW_ENABLED == 'true'
        run: |
          if [ ! -f "$RUNNER_TEMP/indexnow.json" ]; then
            echo "no artefact: nothing to ping"
            exit 0
          fi
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @"$RUNNER_TEMP/indexnow.json" -w '%{http_code}\n'
      - uses: actions/cache/save@v6
        with:
          path: node_modules/.cache/hastcode
          key: hastcode-build-${{ github.run_id }}-${{ github.run_attempt }}
