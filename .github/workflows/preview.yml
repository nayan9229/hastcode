# Preview deployment for every branch (spec user story 25), then Lighthouse
# CI against it.
#
# Triggers: a push to any branch but main (main is production.yml) runs the
# whole workflow, so a branch gets its preview whether or not it has a pull
# request, and a same-repo pull request is not built twice (its pushes
# already run here). pull_request runs only `make test`, and only for pull
# requests from forks, which get no secrets to deploy with.
#
# Deploys go through the Vercel CLI from this runner (`vercel build` +
# `vercel deploy --prebuilt`), not Vercel's Git integration, which
# vercel.json turns off: Vercel's build image has no Go toolchain on PATH for
# the build command, and production needs the build machine afterwards for
# the IndexNow ping (see production.yml and README "Deploying").
#
# Secrets (names only; values come from scripts/setup-deploy.sh):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (No protection bypass secret: Lighthouse moves to Cloudflare Previews,
# ticket 08; Vercel is only the QA Target, ADR-0004.)
name: Preview

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    # Pushes (any branch but main), and pull requests from forks only: a
    # same-repo pull request's commits are already tested by their push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make test

  deploy:
    name: Deploy preview
    # Branch pushes only: pull requests from forks get no secrets (nothing
    # to deploy with), and same-repo pull requests deploy on push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      lighthouse-urls: ${{ steps.urls.outputs.list }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          vercel-cli: "true"
      # After npm ci (which wipes node_modules/). Hero image variants,
      # rendered diagrams and the per-mode page manifests. A branch restores its
      # own latest cache, else main's.
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/hastcode
          key: hastcode-build-${{ github.run_id }}
          restore-keys: hastcode-build-
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      # vercel.json: no install step (done above), build command `make
      # build`, which reads MODE from the environment. Preview mode
      # includes drafts, so a draft PR can be read on its preview URL.
      - run: vercel build --token="$VERCEL_TOKEN"
        env:
          MODE: preview
      # Previews never ping IndexNow; keep the artefact out of the upload.
      - run: rm -f .vercel/output/indexnow.json
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - id: urls
        run: |
          {
            echo 'list<<EOF'
            scripts/lighthouse-urls.sh "${{ steps.deploy.outputs.url }}" .vercel/output
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        with:
          path: node_modules/.cache/hastcode
          key: hastcode-build-${{ github.run_id }}-${{ github.run_attempt }}

  lighthouse:
    name: Lighthouse CI
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @lhci/cli@0.15.1 --no-audit --no-fund
      # Budgets live in lighthouserc.json: mobile LCP <= 1500 ms (median of
      # 3 runs), CLS 0 (worst run), first-party script transfer <= 60 KB
      # (a secondary guard: Plausible is blocked here and transfer is
      # compressed; the total-JS budget, uncompressed with analytics, is
      # TestJSBudget_EveryPageStaysWithin60KB in make test). Any miss fails
      # this check. Reports are uploaded as a build artefact, never to
      # public storage (preview pages may hold drafts).
      - name: Run Lighthouse against the preview
        env:
          URLS: ${{ needs.deploy.outputs.lighthouse-urls }}
        run: |
          args=()
          while IFS= read -r u; do
            [ -n "$u" ] && args+=("--collect.url=$u")
          done <<< "$URLS"
          lhci autorun --config=lighthouserc.json "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
