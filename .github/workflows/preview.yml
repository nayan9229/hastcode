# Preview for every branch push but main (spec "Publishing", user story 11):
# `make test`, then a preview-mode build (drafts included, images to R2),
# uploaded as a new version of the Cloudflare Worker with
# `wrangler versions upload`. That never touches what hastcode.com serves:
# the upload is not deployed, it only gets its own Version Preview URL
# (`<version prefix>-hastcode.<subdomain>.workers.dev`, enabled by
# `preview_urls: true` in the builder's wrangler.json; `*.workers.dev`
# hosts send X-Robots-Tag: noindex). Lighthouse CI then runs against that
# URL with v1's budgets (lighthouserc.json).
#
# The v1 Vercel preview is gone (ticket 08): Vercel is only the QA Target,
# deployed by Publish tags (publish.yml).
#
# Secrets (names only): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
name: Preview

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make test

  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
      lighthouse-urls: ${{ steps.urls.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # After npm ci (which wipes node_modules/). This branch's own latest
      # cache, else the last Production Publish's (saved on main, which
      # every branch can restore): encoded images and rendered diagrams.
      # The path list must match publish.yml's build cache exactly (it is
      # part of the cache version), or the fallback never restores.
      - uses: actions/cache/restore@v6
        with:
          path: &build-cache |
            node_modules/.cache/hastcode/images
            node_modules/.cache/hastcode/mermaid
          key: hastcode-preview-${{ github.run_id }}
          restore-keys: |
            hastcode-preview-
            hastcode-cloudflare-
      # Same bucket as Production (content-hashed keys, so a draft's images
      # are simply new objects; `prune` cleans up abandoned ones).
      - name: Build (preview mode, images to R2)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make build MODE=preview FLAGS=-image-store=r2
      # Previews never ping IndexNow; the adapter removes config.json.
      - run: rm -f .vercel/output/indexnow.json
      - run: make adapt TARGET=cloudflare
      # `versions upload` creates a Worker version without deploying it
      # (Production keeps serving the last `wrangler deploy`).
      - id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: versions upload --config .vercel/output/wrangler.json --message preview-${{ github.sha }}
      # The action's deployment-url output carries the Version Preview URL;
      # fall back to Wrangler's "Version Preview URL: …" line.
      - id: url
        env:
          ACTION_URL: ${{ steps.upload.outputs.deployment-url }}
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url="$ACTION_URL"
          if [ -z "$url" ]; then
            url=$(grep -oE 'Version Preview URL: https://[^[:space:]]+' <<<"$OUTPUT" | head -n1 | sed 's/^Version Preview URL: //' || true)
          fi
          if [ -z "$url" ]; then
            echo "::error::no Version Preview URL in the wrangler output (is preview_urls on and the workers.dev subdomain enabled?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - id: urls
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          {
            echo 'list<<EOF'
            scripts/lighthouse-urls.sh "$URL" .vercel/output
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        with:
          path: *build-cache
          key: hastcode-preview-${{ github.run_id }}-${{ github.run_attempt }}

  lighthouse:
    name: Lighthouse CI
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @lhci/cli@0.15.1 --no-audit --no-fund
      # Budgets live in lighthouserc.json: mobile LCP <= 1500 ms (median of
      # 3 runs), CLS 0 (worst run), first-party script transfer <= 60 KB
      # (a secondary guard: Plausible is blocked here and transfer is
      # compressed; the total-JS budget, uncompressed with analytics, is
      # TestJSBudget_EveryPageStaysWithin60KB in make test). Any miss fails
      # this check. Reports are uploaded as a build artefact, never to
      # public storage (preview pages may hold drafts).
      - name: Run Lighthouse against the preview
        env:
          URLS: ${{ needs.deploy.outputs.lighthouse-urls }}
        run: |
          args=()
          while IFS= read -r u; do
            [ -n "$u" ] && args+=("--collect.url=$u")
          done <<< "$URLS"
          lhci autorun --config=lighthouserc.json "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
