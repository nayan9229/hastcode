name: Set up build tools
description: >-
  Go (version from go.mod), Node 24, `npm ci` (Mermaid renderer, Pagefind)
  and optionally the pinned Vercel CLI. Restore the build cache only after
  this: `npm ci` deletes node_modules/, and the cache lives under
  node_modules/.cache/hastcode/.
inputs:
  vercel-cli:
    description: Install the Vercel CLI (deploy jobs only).
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Install Node build tools
      shell: bash
      run: npm ci --no-audit --no-fund
    - name: Install Vercel CLI
      if: inputs.vercel-cli == 'true'
      shell: bash
      # Pinned: 65.0.0 is the version `vercel build` was checked with
      # locally (Build Output from `make build` + @vercel/go function merged).
      run: npm install --global vercel@65.0.0 --no-audit --no-fund
