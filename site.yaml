# Site config for the builder (builder.LoadConfig). Mode comes from the
# -mode flag, not this file. Add a Vertical by adding one entry here.
site_url: https://hastcode.com
# Plausible analytics site (cookieless). Blank omits the script entirely.
plausible_domain: hastcode.com
# Ads: one flag switches every ad slot from an empty fixed-height
# placeholder to an AdSense unit. Off in v1; adsense_client (ca-pub-...)
# is required when ads_enabled is true.
ads_enabled: false
adsense_client: ""
# IndexNow key (indexnow.org): public by design, served at /<key>.txt.
# Keep it stable; changing it invalidates the key Bing has verified.
# Blank turns IndexNow off.
indexnow_key: 465f05c90b9917457c1ad83b8df48051
# The publication's own profiles elsewhere (home Organization sameAs).
same_as: []
# Hero image cache (encoded variants keyed on source bytes). Default
# node_modules/.cache/hastcode/images, which CI persists between deploys.
# images:
#   cache_dir: node_modules/.cache/hastcode/images
# Verticals: slug (hub at /<slug>/), name, description (shown on the home
# page and the hub), order (header nav and home order). Adding an entry
# adds its hub, nav link and home entry; no code change.
verticals:
  - slug: distributed-systems
    name: Distributed Systems
    description: Consensus, replication, clocks and how systems that span many machines fail.
    order: 1
  - slug: databases-storage
    name: Databases & Storage
    description: Storage engines, indexes, transactions and how real databases keep data safe and fast.
    order: 2
  - slug: apis-networking
    name: APIs & Networking
    description: Protocols, API design, gateways, load balancing and the network between services.
    order: 3
  - slug: infrastructure-cloud
    name: Infrastructure & Cloud
    description: Schedulers, deploy pipelines, cloud primitives and the platforms systems run on.
    order: 4
  - slug: ai-ml-systems
    name: AI/ML Systems
    description: Training, serving, retrieval and the infrastructure behind production machine learning.
    order: 5
  - slug: languages-runtimes
    name: Languages & Runtimes
    description: Compilers, garbage collectors, concurrency models and the runtimes code executes in.
    order: 6
